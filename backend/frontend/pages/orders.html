<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders - AM.BS</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="top-nav">
    <strong class="wordmark"><span class="brand-mark">A</span>AM.BS <span class="tag">RMS</span></strong>
    <div>
      <a href="browse.html">Browse</a>
      <a href="cart.html" id="cartLink">Cart</a>
      <a href="profile.html" id="profileLink">My Profile</a>
      <a href="#" id="logoutLink">Log Out</a>
    </div>
  </div>

  <div class="orders-wrap">
    <a class="back-link" href="profile.html">&larr; Back to Profile</a>
    <h1>My Orders</h1>

    <div class="error" id="pageError"></div>

    <div id="emptyState" style="display:none" class="empty-state">
      <p>You haven't placed any orders yet.</p>
      <p><a href="browse.html" class="back-link" style="display:inline">Start Shopping</a></p>
    </div>

    <div id="ordersContent" style="display:none">
      <table class="orders-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Delivery</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ordersList"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
