<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Late Fee Rules - AM.BS</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="top-nav">
    <strong class="wordmark"><span class="brand-mark">A</span>AM.BS <span class="tag">RMS</span></strong>
    <div>
      <a href="admin-dashboard.html">Dashboard</a>
      <a href="admin-products.html">Products</a>
      <a href="admin-pricelists.html">Pricelists</a>
      <a href="admin-rental-periods.html">Rental Periods</a>
      <a href="admin-quotation-templates.html">Quotation Templates</a>
      <a href="admin-quotations.html">Quotations</a>
      <a href="admin-pickups.html">Pickups</a>
      <a href="admin-returns.html">Returns</a>
      <a href="admin-late-fee-rules.html">Late Fee Rules</a>
      <a href="#" id="logoutLink">Log Out</a>
    </div>
  </div>

  <div class="admin-wrap">
    <div class="admin-card">
      <h2 id="formTitle">Add Late Fee Rule</h2>
      <form id="lateFeeRuleForm">
        <input type="hidden" id="lateFeeRuleId">
        <div class="form-row">
          <div>
            <label>Product (optional — leave blank for a global/fallback rule)</label>
            <select id="productId">
              <option value="">-- Global (no specific product) --</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Rate Type</label>
            <select id="rateType" required>
              <option value="">-- Select Rate Type --</option>
              <option value="hourly">Hourly</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <div>
            <label>Rate Amount</label>
            <input type="text" id="rateAmount" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Grace Period (hours)</label>
            <input type="text" id="gracePeriodHours" placeholder="0">
          </div>
          <div>
            <label>Max Fee (optional)</label>
            <input type="text" id="maxFee">
          </div>
        </div>
        <div class="form-row">
          <button type="submit" style="max-width:200px">Save Rule</button>
          <button type="button" class="secondary" id="cancelEditBtn" style="max-width:200px">Cancel</button>
        </div>
        <div class="error" id="formError"></div>
      </form>
    </div>

    <div class="admin-card">
      <h2>Late Fee Rules</h2>
      <table class="admin-table">
        <thead>
          <tr><th>Product</th><th>Rate Type</th><th>Rate Amount</th><th>Grace Period (hrs)</th><th>Max Fee</th><th>Actions</th></tr>
        </thead>
        <tbody id="lateFeeRulesTableBody"></tbody>
      </table>
      <div class="error" id="listError"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/admin-late-fee-rules.js"></script>
</body>
</html>
